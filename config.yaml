      date_fin: Date fin
enrich:
  passeports:
    other: clients
    label: clients
    count_sql: SELECT COUNT(*) AS total FROM clients WHERE id IN (SELECT client_id
      FROM passeports WHERE {where})
    select_sql: "SELECT c.*, p.num_passeport, p.nationalite,\n       p.date_emission,\
      \ p.date_expiration\nFROM passeports p\nJOIN clients c ON p.client_id = c.id\n\
      WHERE p.id IN (SELECT id FROM passeports WHERE {where})\nORDER BY p.date_expiration\
      \ DESC\n"
  employes:
    other: affectations
    label: affectations
    count_sql: SELECT COUNT(*) AS total FROM affectations WHERE employe_id IN (SELECT
      id FROM employes WHERE {where})
    select_sql: "SELECT e.*, a.agence, a.ville AS ville_affectation,\n       a.pays\
      \ AS pays_affectation, a.continent,\n       a.date_debut, a.date_fin\nFROM employes\
      \ e\nJOIN affectations a ON e.id = a.employe_id\nWHERE e.id IN (SELECT id FROM\
      \ employes WHERE {where})\nORDER BY a.date_debut DESC\n"
  affectations:
    other: employes
    label: employes
    count_sql: SELECT COUNT(*) AS total FROM employes WHERE id IN (SELECT employe_id
      FROM affectations WHERE {where})
    select_sql: "SELECT e.*, a.agence, a.ville AS ville_affectation,\n       a.pays,\
      \ a.continent, a.date_debut, a.date_fin\nFROM affectations a\nJOIN employes\
      \ e ON a.employe_id = e.id\nWHERE a.id IN (SELECT id FROM affectations WHERE\
      \ {where})\n"
  clients:
    other: voyages
    label: voyages
    count_sql: SELECT COUNT(*) AS total FROM voyages WHERE client_id IN ({ids})
    select_sql: "SELECT c.*,\n       v.id AS voyage_id, v.destination, v.pays_destination,\
      \ v.continent,\n       v.date_depart, v.date_retour, v.duree_jours,\n      \
      \ v.type_voyage, v.budget, v.statut, v.note\nFROM clients c\nJOIN voyages v\
      \ ON c.id = v.client_id\nWHERE c.id IN ({ids})\nORDER BY v.date_depart DESC\n"
  voyages:
    other: clients
    label: clients
    count_sql: SELECT COUNT(*) AS total FROM clients WHERE id IN (SELECT client_id
      FROM voyages WHERE {where})
    select_sql: "SELECT c.*, v.destination, v.pays_destination,\n       v.date_depart,\
      \ v.date_retour, v.budget\nFROM voyages v\nJOIN clients c ON v.client_id = c.id\n\
      WHERE v.id IN (SELECT id FROM voyages WHERE {where})\nORDER BY v.date_depart\
      \ DESC\n"